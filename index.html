<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кинозал — смотрим вместе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0b0e;--p:#131318;--b:#212129;--t:#ececf0;--m:#85858f;--a:#e9b872}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font:15px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
input{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:11px 14px;outline:0;min-width:0;width:100%;transition:border-color .15s}
input:focus{border-color:var(--a)}
button{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap;transition:border-color .15s,filter .15s}
button:hover{border-color:#3a3a46}
button:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.pri{background:var(--a);border-color:var(--a);color:#16110a;font-weight:600}
.pri:hover{filter:brightness(1.08);border-color:var(--a)}
button.off{color:#ff8a96}
.logo{font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.logo:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--a);box-shadow:0 0 14px 2px #e9b87299}
#landing{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 50% 0,#1d1912,transparent)}
.card{max-width:380px;width:100%;display:grid;gap:14px}
.card .logo{margin-bottom:10px}
h1{font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.02em}
.card p,#new{color:var(--m)}
#new{font-size:14px;text-align:center}
#room{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--b)}
header .logo{margin-right:auto}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100dvh - 170px);background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--b)}
video,#ytBox,#ytBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--m);padding:20px}
form{display:flex;gap:8px}
aside{display:flex;flex-direction:column;gap:12px;min-height:0;background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px}
#people{display:flex;flex-wrap:wrap;gap:6px}
#people span{font-size:13px;padding:3px 10px;border:1px solid var(--b);border-radius:99px;color:var(--m)}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{word-break:break-word}
.m b{color:var(--a);font-weight:500;margin-right:6px}
.m b.me{color:#9ad8b0}
.s{color:var(--m);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#25252e;border:1px solid #34343f;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
 main{display:flex;flex-direction:column;overflow:auto}
 .player{max-height:none;flex:none}
 aside{flex:1;min-height:300px}
 header #copy{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="landing">
 <div class="card">
  <div class="logo">Кинозал</div>
  <h1>Смотрите кино вместе</h1>
  <p>Вставьте ссылку на фильм, отправьте друзьям ссылку на комнату. Видео играет синхронно, а общаться можно голосом и в чате.</p>
  <input id="name" placeholder="Ваше имя" maxlength="20" autocomplete="nickname">
  <button id="go" class="pri"></button>
  <a id="new" href="#">Создать свою комнату</a>
 </div>
</section>

<section id="room" hidden>
 <header>
  <div class="logo">Кинозал</div>
  <button id="mic"></button>
  <button id="copy">Скопировать ссылку</button>
 </header>
 <main>
  <div class="stage">
   <div class="player">
    <video id="v" controls playsinline hidden></video>
    <div id="ytBox" hidden></div>
    <div id="empty">Вставьте ссылку на фильм ниже,<br>и он запустится у всех в комнате</div>
   </div>
   <form id="lf">
    <input id="url" placeholder="Ссылка: mp4, webm, m3u8 или YouTube" autocomplete="off" inputmode="url">
    <button class="pri">Запустить</button>
   </form>
  </div>
  <aside>
   <div id="people"></div>
   <div id="log"></div>
   <form id="cf">
    <input id="msg" placeholder="Сообщение" autocomplete="off" maxlength="500">
    <button aria-label="Отправить">Отправить</button>
   </form>
  </aside>
 </main>
</section>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
/* ---------- Настройки ----------
   Для сложных сетей (корпоративный Wi-Fi, часть мобильных операторов) добавьте TURN-сервер,
   например бесплатный тариф metered.ca:
   {urls:'turn:...',username:'...',credential:'...'} */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]};

const $=s=>document.querySelector(s);
const vid=$('#v'),ytBox=$('#ytBox'),logEl=$('#log');
let peer,me,host=0,hostId=location.hash.slice(1),conns=[],names={},stream,noMic=0,muted=0;
let mode,yt,hls,cur='',quiet=0,lastT=0,auds={},tt,ytP;

/* ---------- Интерфейс ---------- */
const toast=x=>{const e=$('#toast');e.textContent=x;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3500)};
function add(n,t,sys){
  const d=document.createElement('div');d.className=sys?'m s':'m';
  if(!sys){const b=document.createElement('b');b.textContent=n;if(n===me)b.className='me';d.append(b)}
  d.append(t);logEl.append(d);logEl.scrollTop=logEl.scrollHeight;
}
function render(l){const p=$('#people');p.textContent='';l.forEach(n=>{const s=document.createElement('span');s.textContent=n;p.append(s)})}
const micUI=()=>{const b=$('#mic');b.textContent=noMic?'Только слушаю':muted?'Микрофон выключен':'Микрофон включён';b.classList.toggle('off',!!(muted||noMic))};

function init(){
  $('#go').textContent=hostId?'Присоединиться':'Создать комнату';
  $('#new').hidden=!hostId;
  try{$('#name').value=localStorage.kn||''}catch{}
}
$('#new').onclick=e=>{e.preventDefault();history.replaceState(null,'',location.pathname);hostId='';init()};
$('#go').onclick=start;
$('#name').onkeydown=e=>e.key=='Enter'&&start();
$('#copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>toast('Ссылка скопирована'),()=>prompt('Скопируйте ссылку',location.href));
$('#mic').onclick=()=>{
  if(noMic)return toast('Микрофон недоступен — разрешите доступ в настройках браузера и зайдите снова');
  muted=!muted;stream.getAudioTracks().forEach(t=>t.enabled=!muted);micUI();
};
$('#cf').onsubmit=e=>{
  e.preventDefault();const m=$('#msg').value.trim();if(!m)return;
  $('#msg').value='';add(me,m);send({t:'chat',n:me,m});
};
$('#lf').onsubmit=e=>{
  e.preventDefault();const u=$('#url').value.trim();
  if(!/^https?:\/\//i.test(u))return toast('Нужна ссылка, начинающаяся с http:// или https://');
  load(u,0,1);send({t:'load',u});
};

/* ---------- Плеер ---------- */
const echo=()=>Date.now()<quiet,hush=()=>quiet=Date.now()+900;
const ytAPI=()=>ytP||(ytP=new Promise(r=>{window.onYouTubeIframeAPIReady=r;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s)}));
const time=()=>mode=='yt'?(yt&&yt.getCurrentTime?yt.getCurrentTime():0):vid.currentTime;
const paused=()=>mode=='yt'?!(yt&&yt.getPlayerState&&yt.getPlayerState()==1):vid.paused;
const seekTo=t=>mode=='yt'?(yt&&yt.seekTo&&yt.seekTo(t,true)):(vid.currentTime=t);
const play=()=>mode=='yt'?(yt&&yt.playVideo&&yt.playVideo()):vid.play().catch(()=>toast('Браузер заблокировал автозапуск — нажмите ▶ в плеере'));
const pause=()=>mode=='yt'?(yt&&yt.pauseVideo&&yt.pauseVideo()):vid.pause();
const out=t=>{if(!echo()&&cur)send({t,c:time()})};

vid.onplay=()=>out('play');vid.onpause=()=>out('pause');vid.onseeked=()=>out('seek');
vid.onerror=()=>cur&&toast('Не удалось открыть ссылку: нужна прямая ссылка на файл, и сервер должен разрешать доступ с других сайтов');
setInterval(()=>{ // YouTube не сообщает о перемотке — ловим скачок времени
  if(mode!='yt'||!yt||!yt.getCurrentTime)return;
  const t=yt.getCurrentTime();
  if(Math.abs(t-lastT)>2.5&&!echo())send({t:'seek',c:t});
  lastT=t;
},500);

function load(u,t=0,p=0){
  hush();cur=u;$('#empty').hidden=true;$('#url').value='';
  hls&&hls.destroy();hls=0;
  const id=(u.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
  if(id){
    mode='yt';vid.pause();vid.removeAttribute('src');vid.hidden=true;ytBox.hidden=false;lastT=t;
    ytAPI().then(()=>{
      if(cur!=u)return;
      ytBox.innerHTML='<div id="ytp"></div>';
      yt=new YT.Player('ytp',{width:'100%',height:'100%',videoId:id,playerVars:{start:~~t,autoplay:p?1:0,rel:0},
        events:{onStateChange:e=>{e.data==1&&out('play');e.data==2&&out('pause')}}});
    });
  }else{
    mode='h';yt&&yt.destroy&&yt.destroy();yt=0;ytBox.innerHTML='';ytBox.hidden=true;vid.hidden=false;
    if(/\.m3u8(\?|$)/i.test(u)&&!vid.canPlayType('application/vnd.apple.mpegurl')&&window.Hls&&Hls.isSupported()){
      hls=new Hls();hls.loadSource(u);hls.attachMedia(vid);
    }else vid.src=u;
    vid.onloadedmetadata=()=>{hush();if(t)vid.currentTime=t;if(p)play()};
  }
}

/* ---------- Сеть: PeerJS (WebRTC), звезда для данных + сетка для голоса ---------- */
function send(m,except){conns.forEach(c=>c!==except&&c.open&&c.send(m))}
const sys=(x,e)=>{add('',x,1);send({t:'sys',m:x},e)};
function people(){const l=[me,...Object.values(names)];render(l);send({t:'people',l})}

function wire(c){
  conns.push(c);
  c.on('data',m=>{handle(m,c);if(host&&m.t!='hello')send(m,c)}); // хост ретранслирует всем остальным
  c.on('close',()=>{
    conns=conns.filter(x=>x!==c);
    if(host){const n=names[c.peer];delete names[c.peer];if(n)sys(n+' вышел(а)');people()}
    else add('','Хост покинул комнату — комната закрыта',1);
  });
}

function handle(m,c){
  const t=m.t;
  if(t=='hello'){
    names[c.peer]=m.n;sys(m.n+' зашёл(а)',c);
    c.send({t:'sync',u:cur,c:time(),p:cur&&!paused()});
    c.send({t:'peers',ids:conns.filter(x=>x!==c).map(x=>x.peer)});
    people();
  }
  else if(t=='chat')add(m.n,m.m);
  else if(t=='sys')add('',m.m,1);
  else if(t=='people')render(m.l);
  else if(t=='peers')m.ids.forEach(call);
  else if(t=='load')load(m.u,0,1);
  else if(t=='sync'){if(m.u)load(m.u,m.c,m.p)}
  else if(cur){
    hush();
    if(t=='seek'||Math.abs(time()-m.c)>1.2)seekTo(m.c);
    if(t=='play')play();else if(t=='pause')pause();
  }
}

/* ---------- Голос ---------- */
async function getMic(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch{noMic=1;stream=new AudioContext().createMediaStreamDestination().stream} // тишина вместо микрофона
}
function hook(c){
  c.on('stream',s=>{const a=auds[c.peer]||(auds[c.peer]=new Audio());a.srcObject=s;a.play().catch(()=>{})});
  c.on('close',()=>delete auds[c.peer]);
}
const call=id=>hook(peer.call(id,stream));

/* ---------- Старт ---------- */
async function start(){
  me=$('#name').value.trim().slice(0,20)||'Гость';
  try{localStorage.kn=me}catch{}
  host=!hostId;$('#go').disabled=true;
  await getMic();
  $('#landing').hidden=true;$('#room').hidden=false;micUI();
  peer=new Peer(host?'kz'+Math.random().toString(36).slice(2,8):undefined,{config:ICE});
  peer.on('open',id=>{
    if(host){
      history.replaceState(null,'','#'+id);people();
      add('','Комната готова. Нажмите «Скопировать ссылку» и отправьте её друзьям.',1);
    }else{
      const c=peer.connect(hostId,{reliable:true});
      c.on('open',()=>{wire(c);c.send({t:'hello',n:me});call(hostId)});
    }
  });
  if(host)peer.on('connection',c=>c.on('open',()=>wire(c)));
  peer.on('call',c=>{c.answer(stream);hook(c)});
  peer.on('disconnected',()=>peer.reconnect());
  peer.on('error',e=>toast(e.type=='peer-unavailable'?'Комната не найдена или уже закрыта':'Ошибка соединения: '+e.type));
}
init();
</script>
</body>
</html>
